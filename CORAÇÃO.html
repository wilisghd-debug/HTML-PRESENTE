<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coração Romântico Pro</title>
    <style>
        /* Fundo animado e centralização */
        body {
            background: linear-gradient(-45deg, #000000, #1a0000, #0f0000, #000000);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Efeito de Blur no Menu (Glassmorphism) */
        #setup {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
            text-align: center;
            z-index: 10;
            transition: transform 0.3s ease;
        }

        #container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Estilo do Coração (ASCII) */
        pre {
            color: #ff3333;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.7), 0 0 20px rgba(255, 0, 0, 0.3);
            line-height: 1.1;
            font-weight: bold;
            font-size: 1,5rem; /* Diminuído para caber melhor em telas menores */
            white-space: pre;
        }

        input {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            margin-bottom: 15px;
            width: 200px;
            outline: none;
            text-align: center;
        }

        button {
            padding: 12px 25px;
            background: #ff4d4d;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(255, 77, 77, 0.4);
        }

        button:hover {
            background: #ff0000;
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 0, 0, 0.6);
        }

        #mensagem-final {
            margin-top: 20px;
            font-size: 1.8rem;
            color: #ff4d4d;
            text-shadow: 0 0 10px rgba(255, 77, 77, 0.5);
            font-weight: bold;
            display: none;
            animation: fadeIn 2s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="container">
        <div id="setup">
            <h2 style="color: #ff4d4d; margin-top: 0;">DIGITE SEU NOME</h2>
            <input type="text" id="nomeInput" placeholder="Nome da pessoa..." maxlength="15">
            <br>
            <button onclick="gerarCoracao()">FORMAR CORAÇÃO</button>
        </div>

        <pre id="output"></pre>
        <div id="mensagem-final"></div>
    </div>

    <script>
        function gerarCoracao() {
            const nome = document.getElementById('nomeInput').value || "Amor";
            const output = document.getElementById('output');
            const setup = document.getElementById('setup');
            const mensagemFinal = document.getElementById('mensagem-final');
            
            setup.style.display = 'none'; 

            const moldura = [
"              ***********                    *********               ",
"           *****************             ****************            ",
"        *********************           ********************         ",
"      *************************       *************************      ",
"    *****************************   *****************************    ",
"   ******************************* *******************************   ",
"  *****************************************************************  ",
" ******************************************************************* ",
" ******************************************************************* ",
" ******************************************************************* ",
"  *****************************************************************  ",
"   ***************************************************************   ",
"    *************************************************************    ",
"      *********************************************************      ",
"        *****************************************************        ",
"          *************************************************          ",
"            *********************************************            ",
"              *****************************************              ",
"                *************************************                ",
"                  *********************************                  ",
"                    *****************************                    ",
"                      *************************                      ",
"                        *********************                        ",
"                          *****************                          ",
"                            *************                            ",
"                              *********                              ",
"                                *****                                ",
"                                 ***                                 ",
"                                  *                                  ",


           ];

            let nomeIndex = 0;
            let currentLine = 0;
            output.innerHTML = "";

            function desenharLinha() {
                if (currentLine < moldura.length) {
                    let linhaTexto = "";
                    for (let char of moldura[currentLine]) {
                        if (char === "*") {
                            linhaTexto += nome[nomeIndex % nome.length];
                            nomeIndex++;
                        } else {
                            linhaTexto += " ";
                        }
                    }
                    output.innerHTML += linhaTexto + "\n";
                    currentLine++;
                    // Ajustado para 100ms para ser mais fluido
                    setTimeout(desenharLinha, 100); 
                } else {
                    mensagemFinal.innerText = `Te amo, ${nome}! ❤️`;
                    mensagemFinal.style.display = 'block';
                }
            }

            setTimeout(desenharLinha, 300);
        }
    </script>
</body>
</html>
